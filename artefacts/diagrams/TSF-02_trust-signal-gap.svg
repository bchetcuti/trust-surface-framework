<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TSF-02 — Trust Signal Gap</title>
  <desc id="desc">TrustSurface Framework diagram showing a mismatch between intended or internally assured posture and the posture supported by observable evidence, with a governance response that separates Trust Signals from Evidence and Assessment.</desc>

  <defs>
    <style>
      text { font-family: Poppins, Arial, sans-serif; fill: #0f172a; }
      .frame { fill: #f8fafc; stroke: #d9e2ec; stroke-width: 2; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 1.8; }
      .row { fill: #f8fbfd; stroke: #d9e2ec; stroke-width: 1.2; }
      .gap { fill: #eef6fb; stroke: #0b4f8a; stroke-width: 2.2; }
      .rule { stroke: #8fb2cf; stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 7 8; }
      .arrow { fill: #0b4f8a; opacity: .72; }
      .response { fill: #ffffff; stroke: #d9e2ec; stroke-width: 1.8; }
      .pill { fill: #f8fbfd; stroke: #bfd4e5; stroke-width: 1.2; }
      .kicker { font-size: 14px; font-weight: 700; letter-spacing: .16em; fill: #0b4f8a; }
      .figure-id { font-size: 13px; font-weight: 700; letter-spacing: .12em; fill: #64748b; }
      .title { font-size: 42px; font-weight: 700; letter-spacing: -.03em; }
      .subtitle { font-size: 19px; font-weight: 500; fill: #475569; }
      .panel-label { font-size: 13px; font-weight: 700; letter-spacing: .12em; fill: #64748b; }
      .panel-title { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
      .panel-copy { font-size: 16px; font-weight: 500; fill: #475569; }
      .row-text { font-size: 18px; font-weight: 600; fill: #243447; }
      .dot { fill: #0b4f8a; }
      .gap-kicker { font-size: 13px; font-weight: 700; letter-spacing: .12em; fill: #0b4f8a; }
      .gap-title { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
      .gap-copy { font-size: 17px; font-weight: 500; fill: #334155; }
      .gap-note { font-size: 16px; font-weight: 650; fill: #0b4f8a; }
      .response-label { font-size: 13px; font-weight: 700; letter-spacing: .12em; fill: #0b4f8a; }
      .response-title { font-size: 21px; font-weight: 700; }
      .response-copy { font-size: 16px; font-weight: 500; fill: #475569; }
      .pill-text { font-size: 14px; font-weight: 700; fill: #0b4f8a; }
      .footer { font-size: 13px; font-weight: 600; fill: #64748b; }
    </style>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" class="arrow"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="698" rx="26" class="frame"/>

  <g transform="translate(42 38)">
    <text class="kicker">TRUSTSURFACE FRAMEWORK</text>
    <text x="1116" class="figure-id" text-anchor="end">FIGURE TSF-02 · v1.2 PUBLIC DRAFT</text>
    <text y="52" class="title">Trust Signal Gap</text>
    <text y="84" class="subtitle">Intended or internally assured posture can diverge from the posture supported by observable evidence.</text>
  </g>

  <g transform="translate(42 145)">
    <rect width="320" height="360" rx="20" class="panel"/>
    <text x="24" y="34" class="panel-label">INTENDED / INTERNALLY ASSURED</text>
    <text x="24" y="70" class="panel-title">Expected posture</text>
    <text x="24" y="98" class="panel-copy">
      <tspan x="24">What the organisation intends, governs</tspan>
      <tspan x="24" dy="21">or believes is true.</tspan>
    </text>

    <g transform="translate(24 142)">
      <rect width="272" height="54" rx="13" class="row"/>
      <circle cx="20" cy="27" r="4" class="dot"/>
      <text x="38" y="33" class="row-text">Security &amp; resilience controls</text>

      <rect y="72" width="272" height="54" rx="13" class="row"/>
      <circle cx="20" cy="99" r="4" class="dot"/>
      <text x="38" y="105" class="row-text">Governance &amp; accountability</text>

      <rect y="144" width="272" height="54" rx="13" class="row"/>
      <circle cx="20" cy="171" r="4" class="dot"/>
      <text x="38" y="177" class="row-text">Supplier &amp; operating controls</text>
    </g>
  </g>

  <path d="M373 325H413" class="rule" marker-end="url(#flow-arrow)"/>
  <path d="M787 325H827" class="rule" marker-end="url(#flow-arrow)"/>

  <g transform="translate(423 145)">
    <rect width="354" height="360" rx="22" class="gap"/>
    <text x="177" y="36" text-anchor="middle" class="gap-kicker">CORE CONCEPT</text>
    <text x="177" y="76" text-anchor="middle" class="gap-title">Trust Signal Gap</text>

    <text x="177" y="128" text-anchor="middle" class="gap-copy">
      <tspan x="177">A meaningful mismatch between the</tspan>
      <tspan x="177" dy="25">posture an organisation intends or</tspan>
      <tspan x="177" dy="25">believes it has and the posture</tspan>
      <tspan x="177" dy="25">supported by observable evidence.</tspan>
    </text>

    <text x="177" y="252" text-anchor="middle" class="gap-note">
      <tspan x="177">Evidence does not prove posture by itself.</tspan>
      <tspan x="177" dy="24">It supports assessment of defined Trust Signals.</tspan>
    </text>

    <text x="177" y="318" text-anchor="middle" class="gap-copy">
      <tspan x="177">The gap becomes governable when scope,</tspan>
      <tspan x="177" dy="24">evidence, assessment and ownership are explicit.</tspan>
    </text>
  </g>

  <g transform="translate(837 145)">
    <rect width="321" height="360" rx="20" class="panel"/>
    <text x="24" y="34" class="panel-label">AT THE TRUST SURFACE</text>
    <text x="24" y="70" class="panel-title">Observable Evidence</text>
    <text x="24" y="98" class="panel-copy">
      <tspan x="24">Attributable material used to assess</tspan>
      <tspan x="24" dy="21">defined Trust Signals.</tspan>
    </text>

    <g transform="translate(24 142)">
      <rect width="273" height="54" rx="13" class="row"/>
      <circle cx="20" cy="27" r="4" class="dot"/>
      <text x="38" y="33" class="row-text">Domain &amp; email observations</text>

      <rect y="72" width="273" height="54" rx="13" class="row"/>
      <circle cx="20" cy="99" r="4" class="dot"/>
      <text x="38" y="105" class="row-text">Identity &amp; service observations</text>

      <rect y="144" width="273" height="54" rx="13" class="row"/>
      <circle cx="20" cy="171" r="4" class="dot"/>
      <text x="38" y="177" class="row-text">Reliability &amp; dependency evidence</text>
    </g>
  </g>

  <g transform="translate(42 535)">
    <rect width="1116" height="112" rx="18" class="response"/>
    <text x="24" y="29" class="response-label">GOVERNANCE RESPONSE</text>
    <text x="24" y="58" class="response-title">Assess the gap without overstating what the evidence proves.</text>
    <text x="24" y="84" class="response-copy">Define the target and Trust Signal, gather attributable Evidence, record the assessment result with confidence and freshness, then harden and govern material gaps.</text>

    <g transform="translate(735 20)">
      <rect width="70" height="32" rx="16" class="pill"/>
      <text x="35" y="21" text-anchor="middle" class="pill-text">Target</text>
      <rect x="78" width="96" height="32" rx="16" class="pill"/>
      <text x="126" y="21" text-anchor="middle" class="pill-text">Trust Signal</text>
      <rect x="182" width="78" height="32" rx="16" class="pill"/>
      <text x="221" y="21" text-anchor="middle" class="pill-text">Evidence</text>
      <rect x="268" width="102" height="32" rx="16" class="pill"/>
      <text x="319" y="21" text-anchor="middle" class="pill-text">Assessment</text>
    </g>
  </g>

  <text x="42" y="676" class="footer">TrustSurface Framework · Figure TSF-02 · Supporting diagram</text>
  <text x="1158" y="676" text-anchor="end" class="footer">Framework text remains authoritative where visual shorthand is necessarily concise.</text>
</svg>
