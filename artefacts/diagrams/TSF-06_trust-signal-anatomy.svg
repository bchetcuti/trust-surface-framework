<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TSF-06 — Trust Signal Anatomy</title>
  <desc id="desc">TrustSurface Framework v1.2 supporting diagram showing a Trust Signal as the defined assessment subject, Evidence as the attributable basis for assessment, the Assessment Result with confidence and limitations, and the contribution to the Trust Signal Scorecard and Digital Trust Posture.</desc>

  <defs>
    <style>
      text { font-family: Poppins, Arial, sans-serif; fill: #0f172a; }
      .bg { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; }
      .rule { stroke: #d9e2ec; stroke-width: 2; }
      .panel { fill: #ffffff; stroke: #d9e2ec; stroke-width: 1.5; }
      .panel-accent { fill: #eef6fb; stroke: #0b4f8a; stroke-width: 2; }
      .panel-soft { fill: #f8fbfd; stroke: #bfd4e5; stroke-width: 1.5; }
      .arrow { stroke: #0b4f8a; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .kicker { font-size: 16px; font-weight: 700; letter-spacing: 0.18em; fill: #0b4f8a; }
      .figure-id { font-size: 14px; font-weight: 700; letter-spacing: 0.14em; fill: #64748b; }
      .title-text { font-size: 54px; font-weight: 700; letter-spacing: -0.02em; }
      .subtitle { font-size: 22px; font-weight: 500; fill: #475569; }
      .step { font-size: 14px; font-weight: 700; letter-spacing: 0.12em; fill: #0b4f8a; }
      .panel-title { font-size: 23px; font-weight: 700; }
      .copy { font-size: 15px; font-weight: 500; fill: #475569; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #64748b; }
      .value { font-size: 15px; font-weight: 600; fill: #1e293b; }
      .footer { font-size: 14px; font-weight: 600; fill: #64748b; }
      .footer-strong { font-size: 15px; font-weight: 600; fill: #334155; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0b4f8a"/>
    </marker>
  </defs>

  <rect width="1600" height="900" class="bg"/>
  <rect x="52" y="52" width="1496" height="796" rx="28" class="frame"/>

  <g transform="translate(110 96)">
    <text x="0" y="18" class="kicker">TRUSTSURFACE FRAMEWORK</text>
    <text x="0" y="58" class="figure-id">FIGURE TSF-06 · SUPPORTING DIAGRAM</text>
    <text x="0" y="122" class="title-text">Trust Signal Anatomy</text>
    <text x="0" y="162" class="subtitle">A Trust Signal is what is assessed. Evidence is the attributable basis for that assessment.</text>
  </g>

  <line x1="110" y1="284" x2="1490" y2="284" class="rule"/>

  <g transform="translate(110 332)">
    <!-- Trust Signal -->
    <rect x="0" y="0" width="300" height="374" rx="24" class="panel-accent"/>
    <text x="24" y="36" class="step">1 · TRUST SIGNAL</text>
    <text x="24" y="78" class="panel-title">What is being assessed</text>
    <text x="24" y="112" class="copy">A defined trust-relevant property,</text>
    <text x="24" y="134" class="copy">behaviour or condition.</text>

    <text x="24" y="184" class="label">SPECIMEN</text>
    <text x="24" y="210" class="value">EML-03 · DMARC alignment and policy</text>

    <text x="24" y="256" class="label">DOMAIN</text>
    <text x="24" y="282" class="value">Email Integrity</text>

    <text x="24" y="326" class="label">TARGET / RELATIONSHIP</text>
    <text x="24" y="352" class="value">Primary organisational email domain</text>

    <!-- Arrow 1 -->
    <line x1="310" y1="187" x2="350" y2="187" class="arrow"/>
    <text x="330" y="166" text-anchor="middle" class="label">USING</text>

    <!-- Evidence -->
    <rect x="360" y="0" width="300" height="374" rx="24" class="panel-soft"/>
    <text x="384" y="36" class="step">2 · EVIDENCE</text>
    <text x="384" y="78" class="panel-title">What supports assessment</text>
    <text x="384" y="112" class="copy">Attributable observations, records,</text>
    <text x="384" y="134" class="copy">configurations, artefacts or tests.</text>

    <text x="384" y="184" class="label">SOURCE / OBSERVATION</text>
    <text x="384" y="210" class="value">DMARC DNS record + alignment checks</text>

    <text x="384" y="256" class="label">TRACEABILITY</text>
    <text x="384" y="282" class="value">Target · source · checked-at context</text>

    <text x="384" y="326" class="label">EVIDENCE PROPERTIES</text>
    <text x="384" y="352" class="value">Freshness · relevance · sufficiency</text>

    <!-- Arrow 2 -->
    <line x1="670" y1="187" x2="710" y2="187" class="arrow"/>
    <text x="690" y="166" text-anchor="middle" class="label">SUPPORTS</text>

    <!-- Assessment -->
    <rect x="720" y="0" width="280" height="374" rx="24" class="panel"/>
    <text x="744" y="36" class="step">3 · ASSESSMENT</text>
    <text x="744" y="78" class="panel-title">What Evidence supports</text>
    <text x="744" y="112" class="copy">A method-defined judgement for</text>
    <text x="744" y="134" class="copy">the Trust Signal and target.</text>

    <text x="744" y="184" class="label">RESULT</text>
    <text x="744" y="210" class="value">Strong · Partial · Weak · Unknown</text>

    <text x="744" y="256" class="label">CONFIDENCE</text>
    <text x="744" y="282" class="value">High · Medium · Low</text>

    <text x="744" y="326" class="label">LIMITATIONS</text>
    <text x="744" y="352" class="value">Coverage · ambiguity · sampling</text>

    <!-- Arrow 3 -->
    <line x1="1010" y1="187" x2="1050" y2="187" class="arrow"/>
    <text x="1030" y="166" text-anchor="middle" class="label">INFORMS</text>

    <!-- Contribution -->
    <rect x="1060" y="0" width="320" height="374" rx="24" class="panel-accent"/>
    <text x="1084" y="36" class="step">4 · POSTURE</text>
    <text x="1084" y="78" class="panel-title">Where the result goes</text>
    <text x="1084" y="112" class="copy">Assessment results aggregate into</text>
    <text x="1084" y="134" class="copy">governance-ready posture views.</text>

    <text x="1084" y="184" class="label">SCORECARD</text>
    <text x="1084" y="210" class="value">Trust Signal Scorecard</text>

    <text x="1084" y="256" class="label">DOMAIN VIEW</text>
    <text x="1084" y="282" class="value">Domain Judgement</text>

    <text x="1084" y="326" class="label">OUTCOME</text>
    <text x="1084" y="352" class="value">Digital Trust Posture</text>
  </g>

  <g transform="translate(110 760)">
    <line x1="0" y1="0" x2="1380" y2="0" class="rule"/>
    <text x="0" y="30" class="footer">Figure TSF-06 · TrustSurface Framework · v1.2 public draft</text>
    <text x="1380" y="30" text-anchor="end" class="footer-strong">Signal ≠ Evidence ≠ Assessment Result ≠ Posture</text>
  </g>
</svg>
